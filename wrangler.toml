name = "vps-notifier"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[observability]
enabled = true

[triggers]
# 1st: stock check every minute. 2nd: daily catalog/price refresh (must match CATALOG_CRON in src/index.ts).
crons = ["* * * * *", "17 4 * * *"]

[[kv_namespaces]]
binding = "VPS_NOTIFIER"
# Create it with `npx wrangler kv namespace create VPS_NOTIFIER` and paste the id here.
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
OVH_SUBSIDIARY = "FR"
OVH_ENDPOINT = "eu"
PRICE_WITH_TAX = "false"
NOTIFY_ON_FIRST_RUN = "false"
# JSON array of filters, see README. Empty = notify for every restock.
FILTERS = '''
[
  { "name": "Cheap VPS in France", "maxPrice": 7, "countries": ["FR"] },
  { "name": "VPS-2 anywhere in Europe", "plans": ["vps-2027-model2"], "regions": ["europe"] }
]
'''
